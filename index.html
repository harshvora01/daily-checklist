<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E0F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<title>Forge — V-Taper Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@500;600;700&display=swap">
<style>
/* "Iron and Chalk": dark gym floor, chalk numerals, one molten accent. Single deliberate dark theme. */
:root{
  --bg:#0E0F0F; --surface:#181A1A; --surface-2:#232626; --line:#2E3232;
  --text:#F2EFE8; --muted:#8A8F8C; --accent:#FF5A1F; --accent-dim:#5a2a17;
  --pr:#E8C547; --good:#4ADE80; --warn:#F59E0B; --bad:#EF4444; --freeze:#7DD3FC;
  --h-train:#FF5A1F; --h-core:#A78BFA; --h-fuel:#38BDF8; --h-disc:#F472B6; --h-rec:#94A3B8;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --ui:"Manrope",system-ui,-apple-system,sans-serif;
  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--text)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.press{transition:transform .12s}
.press:active{transform:scale(.96)}

#view{padding:calc(var(--safe-t) + 12px) 16px calc(var(--tabh) + var(--safe-b) + 96px);max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:16px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.h1{font-family:var(--display);font-weight:800;font-size:32px;text-transform:uppercase;line-height:1;margin:0}
.h2{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.muted{color:var(--muted)}
.pill{font-family:var(--display);font-weight:700;font-size:14px;padding:3px 9px;border-radius:99px;background:var(--surface-2);letter-spacing:.06em}
.pill.accent{background:var(--accent);color:#111}
.pill.gold{background:var(--pr);color:#111}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(14,15,15,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--accent)}
#tabs button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent)}
#tabs button:not(.on)::after{content:"";width:4px;height:4px}

/* today */
.head{display:flex;align-items:center;justify-content:space-between}
.head .date{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em}
.flame{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent)}
.flame svg{width:20px;height:20px}
.ringwrap{position:relative;width:230px;height:230px;margin:4px auto 0}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .big{font-family:var(--display);font-weight:800;font-size:58px;line-height:1}
.ring-arc{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.session{display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,#2a160e,var(--surface) 70%);border:1px solid #3a2216}
.session.done{background:var(--surface);border-color:var(--line)}
.session.rest{background:var(--surface);border-color:var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:var(--accent);color:#120804;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.08em;text-transform:uppercase;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.sm{height:40px;font-size:16px;border-radius:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1;max-width:100%;background:var(--surface);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;border:2px solid transparent}
.tile svg.arc{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);transform:rotate(-90deg)}
.tile .ic{width:22px;height:22px;color:var(--c)}
.tile .tl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.1;z-index:1}
.tile.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.tile.on .tl{color:var(--text)}
.pips{display:flex;gap:6px}
.pip{flex:1;height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;position:relative;overflow:hidden}
.pip.on{background:var(--c);border-color:var(--c)}
.pip span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
.pip.on span{color:#0a0a0a}
.tip{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45}
.tip b{color:var(--accent);font-family:var(--display);font-size:13px;letter-spacing:.1em}

/* fab */
#fab{position:fixed;right:16px;bottom:calc(var(--tabh) + var(--safe-b) + 16px);width:60px;height:60px;border-radius:50%;background:var(--accent);color:#120804;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,90,31,.35);z-index:19}
#fab svg{width:28px;height:28px}

/* bars */
.bar{height:22px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:8px;transition:width .4s}
.bar .notch{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.6}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{height:52px;border-radius:12px;background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em}
.chip small{font-size:12px;color:var(--muted);margin-left:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);gap:12px}
.li:first-child{border-top:0}
.x{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field input,.field select{height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:0 12px;font-family:var(--display);font-size:22px;font-weight:700;width:100%;color:var(--text)}
.field select{font-family:var(--ui);font-size:15px}

/* train */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.week .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:14px}
.week .dot.done{background:var(--accent);border-color:var(--accent);color:#111}
.week .dot.rest{border-style:dashed}
.week .dot.today{border-color:var(--text)}
.sess{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess .tag{width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.sess.done .tag{background:var(--accent);color:#111}
.sess .info{flex:1;min-width:0}
.sess .t{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}

/* overlay (session / sheets) */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-head{position:sticky;top:0;z-index:2;background:rgba(14,15,15,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.ov-body{padding:16px 16px calc(var(--safe-b) + 120px);max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.exc{background:var(--surface);border-radius:16px;padding:14px}
.exc .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exc .nm{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1.05}
.exc .cue{font-size:12.5px;color:var(--muted);margin-top:4px}
.prev{font-family:var(--display);font-size:14px;font-weight:700;background:var(--surface-2);padding:4px 8px;border-radius:8px;white-space:nowrap;color:var(--muted)}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 48px;gap:8px;align-items:center;padding-top:10px}
.setrow .sn{font-family:var(--display);font-weight:700;color:var(--muted);font-size:16px;text-align:center}
.step{display:flex;align-items:center;height:48px;background:var(--surface-2);border-radius:12px;overflow:hidden}
.step button{width:40px;height:48px;font-size:22px;color:var(--muted);flex:none}
.step input{flex:1;min-width:0;width:100%;height:48px;background:transparent;border:0;text-align:center;font-family:var(--display);font-size:22px;font-weight:700}
.step .u{font-size:10px;color:var(--muted);margin-right:-4px}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.check svg{width:22px;height:22px}
.setrow.done .check{background:var(--accent);border-color:var(--accent);color:#111}
.setrow.done .step{background:color-mix(in srgb,var(--accent) 14%,var(--surface-2))}
.setrow.pr .check{background:var(--pr);border-color:var(--pr)}
.prbadge{font-family:var(--display);font-weight:800;color:#111;background:var(--pr);border-radius:6px;padding:1px 6px;font-size:12px;margin-left:6px;display:inline-block;animation:stamp .5s ease-out}
@keyframes stamp{0%{transform:scale(1.6);opacity:0;box-shadow:0 0 0 0 var(--pr)}60%{opacity:1}100%{transform:scale(1);box-shadow:0 0 18px 0 transparent}}
.up{color:var(--good);font-weight:800}
.addset{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;height:36px}

#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);z-index:45;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#rest .t{font-family:var(--display);font-weight:800;font-size:34px;flex:1;font-variant-numeric:tabular-nums}
#rest button{height:44px;min-width:52px;border-radius:12px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:16px;padding:0 10px}
#rest.flash{animation:flash .4s 3}
@keyframes flash{50%{background:var(--accent);color:#111}}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .sc{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(var(--safe-b) + 18px);display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}

#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + var(--safe-b) + 88px);z-index:70;background:var(--text);color:#111;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700;max-width:488px;margin:0 auto}
#toast button{color:var(--accent);font-weight:800;letter-spacing:.08em;padding:4px 8px}

/* body */
.bignum{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9}
.chart svg{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.mtile .v{font-family:var(--display);font-weight:800;font-size:28px}
.mtile svg{width:100%;height:28px}

/* stats */
.heat{overflow-x:auto}
.heat svg{display:block}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;line-height:1.15}
.badge svg{width:52px;height:56px}
.badge.on{color:var(--text)}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:calc(var(--safe-t) + 28px) 20px calc(var(--safe-b) + 24px);max-width:520px;margin:0 auto}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--accent)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt button{text-align:left;padding:14px;border-radius:14px;background:var(--surface-2);border:2px solid transparent}
.opt button.on{border-color:var(--accent)}
.opt b{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase}
.opt small{color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<button id="fab" class="press" aria-label="Quick add food" data-act="quickfuel" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="tabs"></nav>
<div id="overlay" class="overlay" hidden></div>
<div id="rest" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<title>Forge</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@500;600;700&display=swap">
<style>
/* One screen. Two goals: gym 5x/week (orange) and protein daily (blue). */
:root{
  --bg:#0E0F0F; --card:#181A1A; --card2:#232626; --line:#2E3232;
  --text:#F2EFE8; --muted:#8E938F;
  --gym:#FF5A1F; --gym-ink:#1a0a03; --gym-soft:#2a160e;
  --pro:#38BDF8; --pro-ink:#03202d; --pro-soft:#0f2733;
  --ok:#4ADE80; --ok-soft:#14261a;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --ui:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button:active{transform:scale(.97)}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}

main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.date{font-size:13px;color:var(--muted);font-weight:600}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.streaks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.streak{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;font-size:13px;font-weight:700}
.streak b{font-family:var(--display);font-size:18px;font-weight:800}
.streak.g{background:var(--gym-soft);color:var(--gym)}
.streak.p{background:var(--pro-soft);color:var(--pro)}
.streak svg{width:15px;height:15px}

.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-weight:700;font-size:16px}
.sub{font-size:13px;color:var(--muted)}
.big{font-size:40px;line-height:.9}
.big small{font-size:18px;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted)}
.day .box{width:100%;height:42px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.day .box svg{width:18px;height:18px}
.day.on .box{background:var(--gym);border-color:var(--gym);color:var(--gym-ink)}
.day.today{color:var(--text)}
.day.today .box{border-color:var(--text)}
.day.future .box{opacity:.45}

.next{background:var(--gym-soft);border:1px solid #3a2216}
.next .lbl{font-size:12px;font-weight:700;color:var(--gym);letter-spacing:.08em;text-transform:uppercase}
.next .nm{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.btn{height:52px;border-radius:14px;background:var(--gym);color:var(--gym-ink);font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.06em;text-transform:uppercase;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pro{background:var(--pro);color:var(--pro-ink)}
.btn.ghost{background:var(--card2);color:var(--text)}
.donebar{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700;font-size:18px}
.donebar svg{width:24px;height:24px}

.bar{height:14px;border-radius:7px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pro);border-radius:7px;transition:width .35s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbtn{min-height:48px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px}
.tbtn svg{width:16px;height:16px}
.tbtn.pon{background:var(--pro);border-color:var(--pro);color:var(--pro-ink)}
.tbtn.don{background:var(--ok-soft);border-color:#245a33;color:var(--ok)}
.chip{font-family:var(--display);font-weight:800;font-size:19px}

.pips{display:flex;gap:5px}
.pip{flex:1;height:38px;border-radius:9px;border:1.5px solid var(--line);font-family:var(--display);font-weight:800;color:var(--muted);font-size:14px}
.pip.on{background:var(--pro);border-color:var(--pro);color:var(--pro-ink)}

.foot{display:flex;justify-content:center;gap:18px;padding-top:4px}
.foot button{font-size:13px;color:var(--muted);font-weight:600;padding:8px}

/* workout + sheets */
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.ov-in{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:10px}
.ex{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px;text-align:left;width:100%}
.ex .ck{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.ex .ck svg{width:20px;height:20px}
.ex.on .ck{background:var(--gym);border-color:var(--gym);color:var(--gym-ink)}
.ex.on .en{color:var(--muted);text-decoration:line-through}
.ex .en{font-weight:700;font-size:16px}
.ex .sr{font-family:var(--display);font-weight:800;font-size:22px;margin-left:auto;white-space:nowrap}
.ex .cue{font-size:12.5px;color:var(--muted);margin-top:2px}
.back{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .sc{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input{height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:0 14px;font-family:var(--display);font-weight:800;font-size:26px;color:var(--text);width:100%}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:50;max-width:448px;margin:0 auto;background:var(--text);color:#111;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
#toast button{color:#c2410c;font-weight:800;padding:4px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="ov" class="ov" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
